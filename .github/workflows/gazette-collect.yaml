name: The Gazette

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many days of PRs to scan"
        required: false
        default: "14"
        type: string
      include_open:
        description: "Include open PRs"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      include_merged:
        description: "Include merged PRs"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      release_date:
        description: "Target release date, YYYY-MM-DD"
        required: true
        type: string
      create_pr:
        description: "Create a pull request"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

  pull_request:
    paths:
      - ".github/workflows/gazette-collect.yaml"
      - ".github/scripts/release-collect.js"
      - ".github/scripts/gazette-draft.js"
      - ".github/scripts/gazette-editor.js"

  schedule:
    # Thursday 9:00 PM Eastern during daylight saving time.
    # GitHub cron uses UTC.
    - cron: "0 13 * * 4"

permissions:
  contents: write
  pull-requests: write

jobs:
  collect-release-note-drafts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out docs repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Collect release-note draft partials
        run: node .github/scripts/release-collect.js > ${{ runner.temp }}/gazette-sources.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_days || '14' }}
          INCLUDE_OPEN: ${{ github.event_name == 'workflow_dispatch' && inputs.include_open || 'true' }}
          INCLUDE_MERGED: ${{ github.event_name == 'workflow_dispatch' && inputs.include_merged || 'true' }}
          INCLUDE_SKIPPED: "false"
          PARTIALS_PATH: "docs/modules/release-notes/partials/"

      - name: Show Gazette summary
        run: |
          echo "Gazette source file created:"
          ls -lh ${{ runner.temp }}/gazette-sources.json
          echo "Gazette summary:"
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync(process.env.GAZETTE_FILE,'utf8')); console.log('Candidate PRs:', d.candidate_pr_count); console.log('Release-note partials:', d.partial_count); console.log('Ignored non-partial files:', d.ignored_non_partial_file_count);"
        env:
          GAZETTE_FILE: ${{ runner.temp }}/gazette-sources.json

      - name: Upload Gazette source artifact
        uses: actions/upload-artifact@v5
        with:
          name: gazette-sources
          path: ${{ runner.temp }}/gazette-sources.json
          retention-days: 7

      - name: Set Gazette dates and file
        id: gazette_release
        shell: bash
        run: |
          GAZETTE_RUN_DATE="$(TZ=America/New_York date +%Y-%m-%d)"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PUBLICATION_DATE="${{ inputs.release_date }}"
          else
            PUBLICATION_DATE="$(TZ=America/New_York date -d '+1 day' +%Y-%m-%d)"
          fi

          if [[ -z "${PUBLICATION_DATE}" ]]; then
            echo "::error::release_date is required for manual Gazette runs."
            exit 1
          fi

          RELEASE_FILE_NAME="${PUBLICATION_DATE}.adoc"
          RELEASE_FILE_PATH="docs/modules/release-notes/pages/all-releases/${RELEASE_FILE_NAME}"

          echo "gazette_run_date=${GAZETTE_RUN_DATE}" >> "$GITHUB_OUTPUT"
          echo "publication_date=${PUBLICATION_DATE}" >> "$GITHUB_OUTPUT"
          echo "release_file_name=${RELEASE_FILE_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_file_path=${RELEASE_FILE_PATH}" >> "$GITHUB_OUTPUT"

          echo "Gazette run date: ${GAZETTE_RUN_DATE}"
          echo "Publication date: ${PUBLICATION_DATE}"
          echo "Release file: ${RELEASE_FILE_PATH}"

      - name: Create draft release note artifact
        run: node .github/scripts/gazette-draft.js > ${{ runner.temp }}/gazette-release-notes.adoc
        env:
          GAZETTE_SOURCES_FILE: ${{ runner.temp }}/gazette-sources.json
          RELEASE_DATE: ${{ steps.gazette_release.outputs.publication_date }}

      - name: Set Gazette branch name
        id: gazette_branch
        run: |
          RUN_DATE="$(TZ=America/New_York date +%Y%m%d)"
          DISPLAY_DATE="$(TZ=America/New_York date +%Y-%m-%d)"
          BRANCH_NAME="gazette/weekly-release-note-harvest-${RUN_DATE}"

          echo "run_date=${RUN_DATE}" >> "$GITHUB_OUTPUT"
          echo "display_date=${DISPLAY_DATE}" >> "$GITHUB_OUTPUT"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

          echo "Gazette branch: ${BRANCH_NAME}"

      - name: Create or checkout Gazette branch
        run: |
          BRANCH_NAME="${{ steps.gazette_branch.outputs.branch_name }}"
    
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
    
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
    
          if git ls-remote --exit-code --heads origin "${BRANCH_NAME}" >/dev/null 2>&1; then
            echo "Gazette branch already exists. Checking it out."
            git fetch origin "${BRANCH_NAME}"
            git checkout -B "${BRANCH_NAME}" "origin/${BRANCH_NAME}"
          else
            echo "Creating Gazette branch ${BRANCH_NAME} from main."
            git checkout -b "${BRANCH_NAME}"
          fi

      - name: Write Gazette release note file
        run: |
          mkdir -p "$(dirname "${RELEASE_FILE_PATH}")"
          cp "${{ runner.temp }}/gazette-release-notes.adoc" "${RELEASE_FILE_PATH}"
          echo "Wrote Gazette release note file:"
          ls -lh "${RELEASE_FILE_PATH}"
        env:
          RELEASE_FILE_PATH: ${{ steps.gazette_release.outputs.release_file_path }}

      - name: Run Gazette Editor
        run: node .github/scripts/gazette-editor.js
        env:
          RELEASE_FILE_PATH: ${{ steps.gazette_release.outputs.release_file_path }}
          PUBLICATION_DATE: ${{ steps.gazette_release.outputs.publication_date }}
          NAV_FILE: docs/modules/release-notes/nav.adoc
          LATEST_FILE: docs/modules/release-notes/pages/kobiton-four-latest.adoc

      - name: Upload Gazette repo-shaped artifact
        uses: actions/upload-artifact@v5
        with:
          name: gazette-repo-shaped-release-note-${{ steps.gazette_branch.outputs.run_date }}
          path: ${{ steps.gazette_release.outputs.release_file_path }}
          retention-days: 7

      - name: Create Gazette pull request
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.create_pr == 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.gazette_branch.outputs.branch_name }}
          DISPLAY_DATE: ${{ steps.gazette_branch.outputs.display_date }}
          FILE: ${{ steps.gazette_release.outputs.release_file_path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "$FILE" \
            docs/modules/release-notes/nav.adoc \
            docs/modules/release-notes/pages/kobiton-four-latest.adoc

          if git diff --cached --quiet; then
            echo "No Gazette changes to commit."
          else
            git commit -m "Update weekly Gazette release-note harvest for ${DISPLAY_DATE}"
            git push --set-upstream origin "$BRANCH"
          fi

          EXISTING_PR="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"

          if [ -n "$EXISTING_PR" ]; then
            echo "Gazette PR already exists: #$EXISTING_PR"
            exit 0
          fi

          cat > /tmp/gazette-pr-body.md <<EOF
          ## Summary

          The Gazette compiled release-note partials into a draft release notes page.

          Generated file:
          - \`${FILE}\`

          This PR was generated from release-note partials under:
          - \`docs/modules/release-notes/partials/\`

          Review notes:
          - Confirm included entries belong to this publication.
          - Verify component versions.
          - Review entries for duplicate or previously published content.
          - Review customer-facing wording and section structure.
          - Product-doc changes bundled in source PRs are not applied here.
          EOF

          gh pr create \
            --title "The Gazette: weekly release-note harvest ${DISPLAY_DATE}" \
            --body-file /tmp/gazette-pr-body.md \
            --base main \
            --head "$BRANCH"