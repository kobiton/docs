name: The Gazette

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many days of PRs to scan"
        required: false
        default: "14"
        type: string
      include_open:
        description: "Include open PRs"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      include_merged:
        description: "Include merged PRs"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      release_date:
        description: "Target release date, YYYY-MM-DD"
        required: true
        type: string
      release_label:
        description: "Release label, for example 2608.18"
        required: false
        default: ""
        type: string
      run_claude:
        description: "Compile release-note draft with Claude"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

  pull_request:
    paths:
      - ".github/workflows/gazette-collect.yaml"
      - ".github/scripts/release-collect.js"

permissions:
  contents: read
  pull-requests: read

jobs:
  collect-release-note-drafts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out docs repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect release-note draft partials
        run: node .github/scripts/release-collect.js > ${{ runner.temp }}/gazette-sources.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          INCLUDE_OPEN: ${{ inputs.include_open }}
          INCLUDE_MERGED: ${{ inputs.include_merged }}
          INCLUDE_SKIPPED: "false"
          PARTIALS_PATH: "docs/modules/release-notes/partials/"

      - name: Show Gazette summary
        run: |
          echo "Gazette source file created:"
          ls -lh ${{ runner.temp }}/gazette-sources.json
          echo "Gazette summary:"
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync(process.env.GAZETTE_FILE,'utf8')); console.log('Candidate PRs:', d.candidate_pr_count); console.log('Release-note partials:', d.partial_count); console.log('Ignored non-partial files:', d.ignored_non_partial_file_count);"
        env:
          GAZETTE_FILE: ${{ runner.temp }}/gazette-sources.json

      - name: Upload Gazette source artifact
        uses: actions/upload-artifact@v5
        with:
          name: gazette-sources
          path: ${{ runner.temp }}/gazette-sources.json
          retention-days: 7

      - name: Create draft release note artifact
        run: node .github/scripts/gazette-draft.js > ${{ runner.temp }}/gazette-release-notes.adoc
        env:
          GAZETTE_SOURCES_FILE: ${{ runner.temp }}/gazette-sources.json
          RELEASE_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_date || 'Target release date TBD' }}
          RELEASE_LABEL: ${{ github.event_name == 'workflow_dispatch' && inputs.release_label || 'Target release TBD' }}

      - name: Upload Gazette draft artifact
        uses: actions/upload-artifact@v5
        with:
          name: gazette-release-notes
          path: ${{ runner.temp }}/gazette-release-notes.adoc
          retention-days: 7

      - name: Write Gazette release note file
        run: |
          mkdir -p docs/modules/release-notes/pages/all-releases
          cp ${{ runner.temp }}/gazette-release-notes.adoc docs/modules/release-notes/pages/all-releases/gazette-preview.adoc
          echo "Wrote Gazette preview file:"
          ls -lh docs/modules/release-notes/pages/all-releases/gazette-preview.adoc

      - name: Upload Gazette repo-shaped artifact
        uses: actions/upload-artifact@v5
        with:
          name: gazette-repo-shaped-release-note
          path: docs/modules/release-notes/pages/all-releases/gazette-preview.adoc
          retention-days: 7